<header><p>{{ ruleset_name }} Rules</p></header>
<main>
  <p>You are playing <strong>{{ game }}</strong> with the <strong>{{ ruleset_name }}</strong> ruleset.</p>
  <h4>Rules:</h4>
  <ol>
    {% for rule in ruleset.rules %}
    <li>{{ rule }}</li>
    {% endfor %}
  </ol>
</main>
<footer>
  <button class="success">Start Game</button>
  <button class="light" onclick="window.location.reload()">Start Over</button>
</footer>
