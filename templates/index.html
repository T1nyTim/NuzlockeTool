{% extends "base.html" %}
{% block title %}Nuzlocke Tracker - New Run{% endblock %}
{% block content %}
<div class="columns">
  <div class="column">
    <h2 class="title">Start a New Nuzlocke Run</h2>
    <p class="subtitle">Select your game to get started:</p>
    <form hx-post="/select-game-ruleset" hx-target="#ruleset-selector">
      <div class="field">
        <label for="game">Game Version</label>
        <div class="control">
          <div class="select is-fullwidth">
            <select name="game" id="game" required>
              <option selected disabled value="">-- Select a game --</option>
              {% for game in games %}
              <option value="{{ game }}">{{ game }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>
      <div class="field">
        <div class="control">
          <button type="submit">Continue</button>
        </div>
      </div>
    </form>
    <div id="ruleset-selector" class="mt-4"></div>
  </div>
</div>
{% endblock %}
